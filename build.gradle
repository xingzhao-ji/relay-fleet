plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.5'
}
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
def grpcVersion = '1.76.0'
dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation 'com.google.protobuf:protobuf-java:4.33.0'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'com.google.code.gson:gson:2.13.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets { main { proto { srcDir 'proto' } } }
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.33.0' }
    plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" } }
    generateProtoTasks { all().each { task -> task.plugins { grpc {} } } }
}
test { useJUnitPlatform(); testLogging { events 'passed', 'skipped', 'failed' } }
application { mainClass = 'relay.Main' }
dependencyLocking { lockAllConfigurations() }
