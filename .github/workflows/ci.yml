name: Relay Fleet build and bounded contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/setup.sh
      - run: bash scripts/test-publication.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relay-fleet-evidence
          path: |
            evidence/
            build/reports/tests/
          retention-days: 14
